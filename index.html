<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOK HARBOUR</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

<div class="container">

    <div class="logo">⚓</div>

    <h1>BOOK HARBOUR</h1>

    <h2>Your Reading Port</h2>

    <p class="message">
        本は一隻のヨット。<br>
        今日もあなたの港から<br>
        新しい航海が始まります。
    </p>

<button class="main-button" onclick="startScanner()">
    📷 本を停泊させる
</button>

<div id="reader"></div>

    <button>
        📚 私の港を見る
    </button>

    <button>
        🔍 本を探す
    </button>

    <button>
        ⭐ 出航待ちの本
    </button>

    <div class="status">

        <h3>現在の港</h3>

        <div class="row">
            <span>⚓ 停泊中</span>
            <span>0</span>
        </div>

        <div class="row">
            <span>⛵ 航海中</span>
            <span>0</span>
        </div>

        <div class="row">
            <span>🏁 帰港済み</span>
            <span>0</span>
        </div>

        <div class="row">
            <span>📍 出航待ち</span>
            <span>0</span>
        </div>

    </div>

    <p class="footer">
        Version 0.2
    </p>

</div>

</body>
</html>
